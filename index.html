<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S 值班排班表</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;color:#1d1d1f;background:#fff}
a{color:inherit}button,input,select{font-family:inherit;font-size:16px}
button{cursor:pointer}
:focus-visible{outline:3px solid #0071e3;outline-offset:2px}
.nav{background:#161617;min-height:48px;display:flex;align-items:center;justify-content:center;gap:clamp(16px,4vw,48px);font-size:13px;flex-wrap:wrap;padding:4px 12px}
.nav a{color:#d2d2d7;text-decoration:none}.nav b{color:#f5f5f7}
.hero{background:#000;color:#f5f5f7;text-align:center;padding:clamp(56px,9vw,112px) 24px clamp(56px,8vw,96px)}
.hero h1{margin:8px 0 0;font-size:clamp(64px,13vw,144px);line-height:1.02;letter-spacing:-.03em}
.pill{margin-top:28px;display:inline-block;border:1px solid #424245;border-radius:980px;padding:10px 22px}
.sec{padding:clamp(48px,7vw,88px) 24px}.wrap{max-width:1100px;margin:0 auto}
h2{margin:0;font-size:clamp(32px,5vw,48px);letter-spacing:-.02em}
.sub{margin:8px 0 28px;font-size:19px;color:#6e6e73}
.row{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.card{flex:1 1 360px;background:#fff;border-radius:18px;padding:28px}
.bd{border:1px solid #d2d2d7}
.btn{height:44px;padding:0 20px;border-radius:980px;border:0;background:#0071e3;color:#fff;font-size:15px}
.btn.o{background:#fff;border:1px solid #d2d2d7;color:#1d1d1f}.btn.b{background:#fff;border:1px solid #0071e3;color:#0071e3}
.sq{width:44px;height:44px;border-radius:12px;border:1px solid #d2d2d7;background:#fff}
.in{height:48px;border-radius:12px;border:1px solid #d2d2d7;padding:0 12px;background:#fff;width:100%}
.cal{overflow-x:auto;border:1px solid #d2d2d7;border-radius:18px;background:#fff}
.g7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));min-width:760px}
.wd{background:#f5f5f7;border-bottom:1px solid #d2d2d7;font-size:13px;color:#6e6e73;text-align:center;padding:10px}
.cell{min-height:96px;padding:8px;border-right:1px solid #e8e8ed;border-bottom:1px solid #e8e8ed}
.cell.o{opacity:.45}.cell.f{background:#fafafc}.cell.h{background:#fff1f0}
.n{font-size:13px;font-weight:600;width:24px;height:24px;line-height:24px;text-align:center;border-radius:50%}
.n.t{background:#1d1d1f;color:#fff}.hl{font-size:12px;font-weight:600;color:#c4001d}.hl.w{color:#6e6e73;font-weight:400}
.tag{display:flex;justify-content:space-between;gap:4px;border-radius:6px;padding:3px 6px;margin-top:4px;font-size:12px;font-weight:600;color:#fff}
.tag i{font-style:normal;opacity:.85;font-size:11px}
.dot{width:14px;height:14px;border-radius:50%;flex:none}
.pr{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.od{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;padding:16px 0;border-bottom:1px solid #424245;font-size:17px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:#1d1d1f;color:#f5f5f7;display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;font-size:15px}
.btn:disabled{opacity:.5;cursor:default}
label{font-size:14px;color:#6e6e73;display:block;margin:12px 0 6px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const DEF=['s4','s7','s6','s1','s2','s5','s3'];
const FIX={s1:'#0071e3',s2:'#187a42',s3:'#7a6a00',s4:'#b45309',s5:'#7d3cc8',s6:'#00808a',s7:'#5b6b7a'};
const PAL=['#0071e3','#187a42','#7d3cc8','#00808a','#3a5bd9','#5b6b7a','#8a6d00','#0a7a9e'];
// 離線備援資料（連網時會改用各年度完整資料）
const HOL={'2026-01-01':'開國紀念日','2026-02-15':'小年夜','2026-02-16':'除夕','2026-02-17':'春節初一','2026-02-18':'春節初二','2026-02-19':'春節初三','2026-02-20':'小年夜補假','2026-02-27':'和平紀念日補假','2026-02-28':'和平紀念日','2026-04-03':'兒童節補假','2026-04-04':'兒童節','2026-04-05':'清明節','2026-04-06':'清明節補假','2026-05-01':'勞動節','2026-06-19':'端午節','2026-09-25':'中秋節','2026-09-28':'教師節','2026-10-09':'國慶日補假','2026-10-10':'國慶日','2026-10-25':'光復節','2026-10-26':'光復節補假','2026-12-25':'行憲紀念日','2027-01-01':'開國紀念日','2027-02-04':'小年夜','2027-02-05':'除夕','2027-02-06':'春節初一','2027-02-07':'春節初二','2027-02-08':'春節初三','2027-02-09':'春節補假','2027-02-10':'春節補假','2027-02-28':'和平紀念日','2027-03-01':'和平紀念日補假','2027-04-04':'兒童節','2027-04-05':'清明節','2027-04-06':'兒童節補假','2027-04-30':'勞動節補假','2027-05-01':'勞動節','2027-06-09':'端午節','2027-09-15':'中秋節','2027-09-28':'教師節','2027-10-10':'國慶日','2027-10-11':'國慶日補假','2027-10-25':'光復節','2027-12-24':'行憲紀念日補假','2027-12-25':'行憲紀念日','2027-12-31':'開國紀念日補假'};
const ld=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S={cycle:DEF.slice(),anchor:2,swaps:[],mo:0,a:null,b:null,hol:{},req:{},base:'',msg:'',saving:false,gh:ld('spos-gh',{})};
if(!Array.isArray(S.cycle)||!S.cycle.length)S.cycle=DEF.slice();
const WEEK=6048e5,start=w=>new Date(2026,9,23+7*w,17,0,0),weekOf=d=>Math.floor((d-start(0))/WEEK);
const names=()=>S.cycle.map(n=>(n||'').trim()||'未命名');
const color=n=>{if(FIX[n])return FIX[n];let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))%997;return PAL[h%PAL.length]};
function eff(w){const N=names(),an=Math.min(S.anchor,N.length-1),ov={};const g=x=>ov[x]!==undefined?ov[x]:N[(((x+an)%N.length)+N.length)%N.length];
 for(const[a,b]of S.swaps){const p=g(a),q=g(b);ov[a]=q;ov[b]=p}return g(w)}
const md=d=>(d.getMonth()+1)+'/'+d.getDate();
const label=w=>md(start(w))+'(五) 17:00 – '+md(start(w+1))+'(五) 17:00';
function ensure(y){if(S.req[y])return;S.req[y]=1;
 fetch('https://cdn.jsdelivr.net/gh/ruyut/TaiwanCalendar/data/'+y+'.json').then(r=>{if(!r.ok)throw 0;return r.json()}).then(a=>{const m={};
 a.forEach(x=>{if(x.description)m[x.date.slice(0,4)+'-'+x.date.slice(4,6)+'-'+x.date.slice(6,8)]={t:x.description,off:!!x.isHoliday}});S.hol[y]=m;render()}).catch(()=>{})}
function holInfo(ds){const h=S.hol[ds.slice(0,4)];if(h)return h[ds];return HOL[ds]?{t:HOL[ds],off:true}:undefined}
function saveC(c,an){S.cycle=c;S.anchor=Math.max(0,Math.min(an===undefined?S.anchor:an,c.length-1));S.msg='';render()}
function saveS(s){S.swaps=s;S.msg='';render()}
const pad=n=>String(n).padStart(2,'0');
const wd=w=>{const d=start(w);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const idx=ds=>{const[y,m,d]=ds.split('-').map(Number);return Math.round((Date.UTC(y,m-1,d)-Date.UTC(2026,9,23))/WEEK)};
const norm=o=>({version:1,cycle:(o.cycle||[]).map(String),anchor:+o.anchor||0,swaps:(o.swaps||[]).map(x=>({a:wd(idx(x.a)),b:wd(idx(x.b))}))});
const cfgObj=()=>norm({cycle:S.cycle,anchor:S.anchor,swaps:S.swaps.map(([a,b])=>({a:wd(a),b:wd(b)}))});
const isDirty=()=>!!S.base&&JSON.stringify(cfgObj())!==S.base;
function applyCfg(o){const n=norm(o);if(!n.cycle.length)throw new Error('empty');S.cycle=n.cycle;S.anchor=Math.min(n.anchor,n.cycle.length-1);S.swaps=n.swaps.map(x=>[idx(x.a),idx(x.b)]);S.base=JSON.stringify(cfgObj())}
async function loadCfg(){try{const r=await fetch('config.json?_='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('http '+r.status);applyCfg(await r.json());S.msg=''}catch(e){S.base=JSON.stringify(cfgObj());S.msg='讀不到 config.json，先顯示預設順序。'}render()}
function ghInfo(){const g=Object.assign({},S.gh);if(!g.owner&&location.hostname.endsWith('.github.io'))g.owner=location.hostname.split('.')[0];if(!g.repo&&location.hostname.endsWith('.github.io'))g.repo=location.pathname.split('/')[1]||'';g.branch=g.branch||'main';return g}
function ghSet(){const v=id=>document.getElementById(id).value.trim();S.gh={owner:v('gho'),repo:v('ghr'),branch:v('ghb'),token:v('ght')||S.gh.token||''};sv('spos-gh',S.gh);S.msg='已儲存同步設定。';render()}
async function saveGH(){const g=ghInfo();
 if(!g.token||!g.owner||!g.repo){S.msg='請先到「同步設定」填入帳號、repo 和 token。';render();location.hash='sync';return}
 S.saving=true;S.msg='儲存中…';render();
 try{const api='https://api.github.com/repos/'+g.owner+'/'+g.repo+'/contents/config.json',h={Authorization:'Bearer '+g.token,Accept:'application/vnd.github+json'};
  const r=await fetch(api+'?ref='+encodeURIComponent(g.branch),{headers:h,cache:'no-store'});let sha;
  if(r.ok){const j=await r.json();sha=j.sha;if(JSON.stringify(norm(JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g,'')))))))!==S.base)throw new Error('config.json 已被其他人更新，請按「放棄修改並重新載入」後再改。')}
  else if(r.status===401)throw new Error('Token 無效或已過期，請重新產生。');
  else if(r.status===403)throw new Error('Token 權限不足，需要這個 repo 的 Contents 讀寫權限。');
  else if(r.status!==404)throw new Error('讀取 GitHub 失敗（'+r.status+'）。');
  const text=JSON.stringify(cfgObj(),null,2)+'\n';
  const p=await fetch(api,{method:'PUT',headers:h,body:JSON.stringify({message:'更新排班設定 '+new Date().toLocaleString('zh-TW'),content:btoa(unescape(encodeURIComponent(text))),branch:g.branch,sha})});
  if(!p.ok){if(p.status===409||p.status===422)throw new Error('儲存衝突，請按「放棄修改並重新載入」後再改。');if(p.status===401||p.status===403||p.status===404)throw new Error('沒有寫入權限，請確認帳號、repo 名稱和 token 權限。');throw new Error('儲存失敗（'+p.status+'）。')}
  S.base=JSON.stringify(cfgObj());S.msg='已儲存。GitHub Pages 約 1–2 分鐘後更新給所有人。';setTimeout(()=>{if(!isDirty()){S.msg='';render()}},10000)
 }catch(e){S.msg=e.message||'儲存失敗。'}
 S.saving=false;render()}
function tag(w,t){const n=eff(w);return `<div class="tag" style="background:${color(n)}"><span>${esc(n)}</span><i>${t}</i></div>`}
function render(){
 const now=new Date(),cur=weekOf(now),N=names(),an=Math.min(S.anchor,N.length-1);
 const ref=new Date(now.getFullYear(),now.getMonth()+S.mo,1),first=new Date(ref.getFullYear(),ref.getMonth(),1-ref.getDay());
 [ref.getFullYear(),first.getFullYear(),new Date(first.getFullYear(),first.getMonth(),first.getDate()+41).getFullYear()].forEach(ensure);
 let cells='';
 for(let i=0;i<42;i++){const d=new Date(first.getFullYear(),first.getMonth(),first.getDate()+i),w=weekOf(new Date(d.getFullYear(),d.getMonth(),d.getDate(),12)),fri=d.getDay()===5;
  const ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),inf=holInfo(ds),off=inf&&inf.off;
  cells+=`<div class="cell${d.getMonth()!==ref.getMonth()?' o':''}${off?' h':fri?' f':''}"><div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap"><div class="n${d.toDateString()===now.toDateString()?' t':''}"${off?' style="color:#c4001d"':''}>${d.getDate()}</div>${inf?`<span class="hl${off?'':' w'}">${esc(inf.t)}</span>`:''}</div>${fri?tag(w,'→17:00')+tag(w+1,'17:00 起'):tag(w,'')}</div>`}
 const a=S.a!=null?S.a:cur+1,b=S.b!=null?S.b:cur+2;
 const wo=v=>{let o='';for(let w=cur-1;w<=cur+20;w++)o+=`<option value="${w}"${w===v?' selected':''}>${label(w)}　${esc(eff(w))}</option>`;return o};
 const ms=start(cur+1)-now,dd=Math.floor(ms/864e5),hh=Math.floor(ms%864e5/36e5),mm=Math.floor(ms%36e5/6e4);
 const log=S.swaps.map(([x,y])=>`<div style="padding:12px 0;border-bottom:1px solid #e8e8ed">${md(start(x))} 週 ⇄ ${md(start(y))} 週</div>`).join('')||'<div style="color:#6e6e73">目前沒有換班，依預設順序輪值。</div>';
 const roster=S.cycle.map((n,i)=>`<div class="pr"><span style="width:22px;text-align:right;color:#6e6e73;font-size:14px">${i+1}</span><span class="dot" style="background:${color(N[i])}"></span><input class="in" style="height:44px" aria-label="人員名稱" data-c="name" data-i="${i}" value="${esc(n)}"><button class="sq" data-a="up" data-i="${i}" aria-label="上移">↑</button><button class="sq" data-a="down" data-i="${i}" aria-label="下移">↓</button><button class="sq" style="color:#d7263d" data-a="del" data-i="${i}" aria-label="刪除">✕</button></div>`).join('');
 let up='';for(let w=cur;w<cur+10;w++)up+=`<div class="od"><span style="color:#a1a1a6">${label(w)}</span><span style="font-weight:600">${esc(eff(w))}${w===cur?'<span style="color:#2997ff;font-weight:400">　本週</span>':''}</span></div>`;
 const dirty=isDirty(),g=ghInfo(),bar=(dirty||S.msg)?`<div style="height:84px"></div><div class="bar" role="status"><span>${esc(S.msg||'有尚未儲存的修改。')}</span>${dirty?`<button class="btn" data-a="save"${S.saving?' disabled':''}>儲存到 GitHub</button><button class="btn o" data-a="discard">放棄修改並重新載入</button>`:''}</div>`:'';
 const sync=`<div class="sec" id="sync" style="background:#f5f5f7"><div class="wrap"><h2>同步設定</h2><p class="sub">人員順序與換班存在 repo 的 config.json。有 token 的人可以在網頁上修改並儲存，其他人只會看到最新版。</p><div class="row">
<div class="card"><label for="gho">GitHub 帳號</label><input class="in" id="gho" value="${esc(g.owner||'')}" autocomplete="off"><label for="ghr">Repository 名稱</label><input class="in" id="ghr" value="${esc(g.repo||'')}" autocomplete="off"><label for="ghb">分支</label><input class="in" id="ghb" value="${esc(g.branch)}" autocomplete="off"><label for="ght">Fine-grained token</label><input class="in" id="ght" type="password" autocomplete="off" placeholder="${g.token?'已儲存（留空表示不變更）':'貼上 token'}"><div style="display:flex;gap:12px;margin-top:20px;flex-wrap:wrap"><button class="btn" data-a="ghsave">儲存設定</button><button class="btn o" data-a="ghclear">清除 token</button></div></div>
<div class="card" style="font-size:15px;line-height:1.6"><div style="font-size:21px;font-weight:600;margin-bottom:8px">如何取得 token</div>1. 到 GitHub 的 <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener" style="color:#0066cc">Fine-grained tokens</a> 新增一組。<br>2. Repository access 只選這個 repo。<br>3. Permissions 的 Contents 設為 Read and write。<br>4. 產生後貼到左邊。token 只存在這台瀏覽器，不會寫進 repo。</div></div></div></div>
`
 document.getElementById('app').innerHTML=`
<div class="nav"><b>S 值班</b><a href="#calendar">日曆</a><a href="#swap">手動換班</a><a href="#people">人員設定</a><a href="#sync">同步設定</a><a href="#order">輪值順序</a></div>
<div class="hero"><div style="font-size:21px;color:#a1a1a6;font-weight:600">本週值班</div><h1>${esc(eff(cur))}</h1><div style="margin-top:20px;font-size:clamp(17px,2.2vw,24px);color:#a1a1a6">${label(cur)}</div><div class="pill">距離交班 ${dd} 天 ${hh} 小時 ${mm} 分　下一位：<b>${esc(eff(cur+1))}</b></div></div>
<div class="sec" id="calendar" style="background:#fbfbfd"><div class="wrap"><h2>值班日曆</h2><p class="sub">每週五 17:00 交班，一人值班一週。<span style="color:#c4001d;font-weight:600">　紅色為人事行政總處公告的放假日。</span></p>
<div style="display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:16px"><button class="sq" style="border-radius:50%" data-a="prev" aria-label="上個月">‹</button><div style="font-size:24px;font-weight:600;min-width:150px;text-align:center">${ref.getFullYear()} 年 ${ref.getMonth()+1} 月</div><button class="sq" style="border-radius:50%" data-a="next" aria-label="下個月">›</button><button class="btn" data-a="today">回到今天</button></div>
<div class="cal"><div class="g7">${['日','一','二','三','四','五','六'].map(x=>`<div class="wd">${x}</div>`).join('')}${cells}</div></div></div></div>
<div class="sec" id="swap" style="background:#f5f5f7"><div class="wrap"><h2>手動換班</h2><p class="sub">選擇兩個值班週，兩週的值班人會互換，其餘順序不變。</p><div class="row">
<div class="card"><label for="wa">第一週</label><select class="in" id="wa" data-c="a">${wo(a)}</select><label for="wb">第二週</label><select class="in" id="wb" data-c="b">${wo(b)}</select>
<div style="margin:16px 0;background:#f5f5f7;border-radius:12px;padding:14px;font-size:15px">${a===b?'請選擇兩個不同的週次。':`${md(start(a))} 週 ${esc(eff(a))} ⇄ ${md(start(b))} 週 ${esc(eff(b))}`}</div><button class="btn" style="width:100%;height:48px;font-size:17px" data-a="swap">確認換班</button></div>
<div class="card"><div style="font-size:21px;font-weight:600;margin-bottom:12px">換班紀錄</div><div style="font-size:15px">${log}</div><div style="display:flex;gap:12px;margin-top:20px;flex-wrap:wrap"><button class="btn b" data-a="undo">復原上一次</button><button class="btn o" data-a="reset">全部還原</button></div></div></div></div></div>
<div class="sec" id="people" style="background:#fbfbfd"><div class="wrap"><h2>人員設定</h2><p class="sub">輪值順序共 ${N.length} 個位置，同一人可出現多次。</p><div class="row">
<div class="card bd" style="flex-basis:420px">${roster}<div style="display:flex;gap:8px;margin-top:18px"><input class="in" style="height:44px" id="nn" aria-label="新增人員" placeholder="新增人員，例如 s8"><button class="btn" data-a="add">新增</button></div></div>
<div class="card bd" style="flex-basis:320px"><label for="an" style="font-size:21px;font-weight:600;color:#1d1d1f;margin-top:0">10/23(五) 這週由誰值班</label><select class="in" id="an" data-c="anchor">${N.map((n,i)=>`<option value="${i}"${i===an?' selected':''}>第 ${i+1} 位 · ${esc(n)}</option>`).join('')}</select>
<p style="font-size:15px;color:#6e6e73">以這一週為起點，依上方順序循環。修改順序會連同過去與未來的日曆一起重算；換班以週次記錄，會保留。</p><button class="btn o" style="width:100%" data-a="resetc">還原預設順序</button></div></div></div></div>
${sync}<div class="sec" id="order" style="background:#000;color:#f5f5f7"><div class="wrap"><h2>輪值順序</h2><p class="sub" style="color:#a1a1a6">循環順序：${N.map(esc).join(' → ')}，含換班後的未來 10 週。</p><div style="border-top:1px solid #424245">${up}</div></div></div>${bar}`}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const k=t.dataset.a,i=+t.dataset.i,c=S.cycle.slice(),an=S.anchor;
 if(k==='prev'){S.mo--;render()}else if(k==='next'){S.mo++;render()}else if(k==='today'){S.mo=0;render()}
 else if(k==='swap'){const w0=weekOf(new Date()),a=S.a!=null?S.a:w0+1,b=S.b!=null?S.b:w0+2;if(a!==b)saveS(S.swaps.concat([[a,b]]))}
 else if(k==='undo')saveS(S.swaps.slice(0,-1));else if(k==='reset')saveS([]);
 else if(k==='add'){const v=document.getElementById('nn').value.trim();if(v)saveC(c.concat([v]))}
 else if(k==='del'){if(c.length>1){c.splice(i,1);saveC(c,i<an?an-1:an)}}
 else if(k==='up'&&i>0){[c[i-1],c[i]]=[c[i],c[i-1]];saveC(c,an===i?i-1:an===i-1?i:an)}
 else if(k==='down'&&i<c.length-1){[c[i+1],c[i]]=[c[i],c[i+1]];saveC(c,an===i?i+1:an===i+1?i:an)}
 else if(k==='resetc')saveC(DEF.slice(),2);else if(k==='save')saveGH();else if(k==='discard')loadCfg();else if(k==='ghsave')ghSet();else if(k==='ghclear'){S.gh.token='';sv('spos-gh',S.gh);render()}});
document.addEventListener('change',e=>{const t=e.target,k=t.dataset.c;if(!k)return;
 if(k==='a'){S.a=+t.value;render()}else if(k==='b'){S.b=+t.value;render()}
 else if(k==='anchor')saveC(S.cycle.slice(),+t.value);
 else if(k==='name'){const c=S.cycle.slice();c[+t.dataset.i]=t.value;saveC(c)}});
render();loadCfg();window.addEventListener('beforeunload',e=>{if(isDirty()){e.preventDefault();e.returnValue=''}});setInterval(()=>{if(!document.activeElement||document.activeElement.tagName==='BODY')render()},30000);
</script>
</body>
</html>
